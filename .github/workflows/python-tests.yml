name: Python tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests
      - name: Install package without runtime dependencies
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed CLI entry point
        run: crc --help
      - name: Verify desktop module imports without opening a display
        run: python -c "import review_core.desktop"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
