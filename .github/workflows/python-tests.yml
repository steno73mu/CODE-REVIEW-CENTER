name: Python tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Install package without runtime dependencies
        run: python -m pip install "setuptools>=68" && python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed CLI entry point
        run: crc --help
      - name: Verify desktop module imports without opening a display
        run: python -c "import review_core.desktop"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
