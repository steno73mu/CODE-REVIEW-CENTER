name: Scanner integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scanner-integration:
    name: scanner-integration (\${{ matrix.os }})
    runs-on: \${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CODE-REVIEW-CENTER and pinned Semgrep
        run: python -m pip install "setuptools>=68" && python -m pip install --no-deps --no-build-isolation . && python -m pip install "semgrep==1.187.0"
      - name: Download and verify Gitleaks (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSLo "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSLo "$RUNNER_TEMP/gitleaks_checksums.txt" "$base/gitleaks_8.30.1_checksums.txt"
          grep -F "$asset" "$RUNNER_TEMP/gitleaks_checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Download and verify Gitleaks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "gitleaks_8.30.1_windows_x64.zip"
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $checksums = Join-Path $env:RUNNER_TEMP "gitleaks_checksums.txt"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $archive
          Invoke-WebRequest -Uri "$base/gitleaks_8.30.1_checksums.txt" -OutFile $checksums
          $line = Get-Content $checksums | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
          if (-not $line) { throw "Gitleaks checksum entry not found" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Gitleaks SHA-256 mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "gitleaks"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          Add-Content -Path $env:GITHUB_PATH -Value $destination
      - name: Run real scanner integration smoke
        run: python scripts/scanner_integration_smoke.py
